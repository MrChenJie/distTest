# 环境变量配置

BASE_PATH: ${BASE_PATH:/app}
PLATFORM_VERSION: SASS
CLIENT_ID: ${CLIENT_ID:srm-portal}
GENERATE_SOURCEMAP: false
SKIP_TS_CHECK_IN_START: false   # yarn start 时, 是否跳过 ts 语法检查
SKIP_ESLINT_CHECK_IN_START: true # yarn start 时, 是否跳过 eslint 语法检查
SKIP_NO_CHANGE_MODULE: false # 是否跳过未变更的子模块编译

API_HOST: https://scm.cmhktry.com/gwapi
NO_PROXY: true
PORT: 801
#SRC_WEBSOCKET_HOST: ${BUILD_SRC_WEBSOCKET_HOST:http://sourced.eps2.mcd.com.cn}

#WEBSOCKET_HOST: ws://gatewayd.eps2.mcd.com.cn/hpfm/websocket
#IM_ENABLE: ${IM_ENABLE:false}
#IM_WEBSOCKET_HOST: ${IM_WEBSOCKET_HOST:ws://192.168.16.150:9876}
TRACE_LOG_ENABLE: ${TRACE_LOG_ENABLE:true} # // TraceLog日志追溯分析是否启用，true/false
CUSTOMIZE_ICON_NAME: ${CUSTOMIZE_ICON_NAME:customize-icon}
MULTIPLE_SKIN_ENABLE: false  # UED配置是否启用，true/false
FORCE_PROD_DLL: true
# 解决/pub跳转/路由布局问题
PFM_HOST: https://scm.cmitry.com

#ERP环境地址
ERP_HOST: https://erp.cmhktry.com
#MIP环境地址
MIP_HOST: https://mip.cmitry.com
#CMI文档在线预览地址
OOS_HOST: https://oos.cmhktry.com/doc/online/v2
#NCOA 地址
NCOA_HOST: https://ncoa.cmitry.com
#合同中心地址
CCM_HOST: https://ccm.cmitry.com
#iboss地址
IBOSS_HOST: https://iboss.cmitry.com
#统一门户PROD环境
APP_OMNI_API_SDK_ENV: PROD
#omniPartnerToken统一门户需要访问的token
OMNI_PARTNER_TOKEN: 9a9fhfnana8e33y2723n1l12f8zafvb2

#报名页获取token
CLIENT_ID_REGISTER: cmhk-partner
CLIENT_SECRET: secret
GRANT_TYPE: client_credentials
# // 服务合并的环境变量
routeMap:
  /hpfm: /hpfm
  /iam: /iam
  /hdtt: /hdtt
  /hmsg: /hmsg
  /hptl: /hptl
  /hwfl: /hwfl
  /hdtw: /hdtw
  /hsdr: /hsdr
  /hsgp: /hsgp
  /hitf: /hitf
  /hfle: /hfle
  /oauth: /oauth
  /hagd: /hagd
  /himp: /himp
  /hrpt: /hrpt
  /hcnf: /hcnf
  /hwfp: /hwfp
  /hnlp: /hnlp

# 控制那些变量输入到浏览器环境， 浏览器代码可以通过 process.env.xxx 读取环境变量
CLIENT_ENV_LIST:
  - BASE_PATH
  - PLATFORM_VERSION
  - API_HOST
  - WEBSOCKET_HOST
  - PUBLIC_URL
  - IM_ENABLE
  - IM_WEBSOCKET_HOST
  - TRACE_LOG_ENABLE
  - CUSTOMIZE_ICON_NAME
  - MULTIPLE_SKIN_ENABLE
  - PACKAGE_PUBLIC_URL
  - MULTIPLE_SKIN_ENABLE
  - SKIP_NO_CHANGE_MODULE
  - ERP_HOST
  - MIP_HOST
  - PFM_HOST
  - OOS_HOST
  - NCOA_HOST
  - CCM_HOST
  - IBOSS_HOST
  - APP_OMNI_API_SDK_ENV
  - OMNI_PARTNER_TOKEN
    #报名获取token
  - CLIENT_ID_REGISTER
  - CLIENT_SECRET
  - GRANT_TYPE


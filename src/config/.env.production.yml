BASE_PATH: BUILD_BASE_PATH
PLATFORM_VERSION: BUILD_PLATFORM_VERSION
CLIENT_ID: BUILD_CLIENT_ID
API_HOST: http://172.22.139.12:20673/oauth/
WEBSOCKET_HOST: BUILD_WEBSOCKET_HOST
SRC_WEBSOCKET_HOST: BUILD_SRC_WEBSOCKET_HOST

IM_ENABLE: BUILD_IM_ENABLE # // im是否启用，true/false
IM_WEBSOCKET_HOST: BUILD_IM_WEBSOCKET_HOST # // im websocket 地址
TRACE_LOG_ENABLE: BUILD_TRACE_LOG_ENABLE # // TraceLog日志追溯分析是否启用，true/false
CUSTOMIZE_ICON_NAME: BUILD_CUSTOMIZE_ICON_NAME # // 客制化的iconfont font family 名称

GENERATE_SOURCEMAP: false
SKIP_TS_CHECK_IN_START: false   # yarn start 时, 是否跳过 ts 语法检查
SKIP_ESLINT_CHECK_IN_START: true # yarn start 时, 是否跳过 eslint 语法检查
SKIP_NO_CHANGE_MODULE: true # 是否跳过未变更的子模块编译

NO_PROXY: true
MULTIPLE_SKIN_ENABLE: true  # UED配置是否启用，true/false
FORCE_PROD_DLL: true

#cmhk单点登录域名
CMHK_LOGIN: http://172.22.139.12:20673
#致远审批流域名
APPROVAL_PROCESS: https://bpm-uat.cmhktry.com

# // 服务合并的环境变量
routeMap:
  /hpfm: /hpfm
  /iam: /iam
  /hdtt: /hdtt
  /hmsg: /hmsg
  /hptl: /hptl
  /hwfl: /hwfl
  /hdtw: /hdtw
  /hsdr: /hsdr
  /hsgp: /hsgp
  /hitf: /hitf
  /hfle: /hfle
  /oauth: /oauth
  /hagd: /hagd
  /himp: /himp
  /hrpt: /hrpt
  /hcnf: /hcnf
  /hwfp: /hwfp
  /hnlp: /hnlp

# 控制那些变量输入到浏览器环境， 浏览器代码可以通过 process.env.xxx 读取环境变量
CLIENT_ENV_LIST:
  - BASE_PATH
  - PLATFORM_VERSION
  - API_HOST
  - WEBSOCKET_HOST
  - PUBLIC_URL
  - IM_ENABLE
  - IM_WEBSOCKET_HOST
  - TRACE_LOG_ENABLE
  - CUSTOMIZE_ICON_NAME
  - MULTIPLE_SKIN_ENABLE
  - PACKAGE_PUBLIC_URL
  - MULTIPLE_SKIN_ENABLE
  - SRC_WEBSOCKET_HOST
  - SKIP_NO_CHANGE_MODULE
  - CMHK_LOGIN
  - APPROVAL_PROCESS
